<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepVibe</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Deckkraft des großen Startlogos (Wasserzeichen) — hier zentral tunebar. */
        --startup-logo-opacity: 0.1;
        /* 原生边框窗口（Wayland）不再透出深色底，见 desktopWindowChrome.ts；启动壳自带深色背景，
           避免 Electron 默认白底直接闪现。 */
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      /* 不再使用小图标卡片：整个窗口用深色品牌底，Logo 占 ~80% 高度直接居中。 */
      .startup-logo-shell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--startup-logo-height, 80vh);
        max-width: 90vw;
        opacity: 0;
        transform: scale(0.94);
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo {
        height: 100%;
        width: auto;
        max-width: 90vw;
        object-fit: contain;
        /* 只作背景水印：低调地“ins App-Icon hineinschrumpfen” während des Starts.
           Für keinen Shrink: animation-Zeile entfernen (dann greift die Basis-Deckkraft). */
        opacity: var(--startup-logo-opacity, 0.1);
        animation: shrink-to-zero 7s forwards;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.94);
        }

        45% {
          opacity: 1;
          transform: scale(1.01);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes shrink-to-zero {
        0% {
          transform: scale(1);
          opacity: var(--startup-logo-opacity, 0.1);
        }

        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }

        .startup-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="startup-logo-shell">
        <img class="startup-logo" src="/startup-logo.png" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
