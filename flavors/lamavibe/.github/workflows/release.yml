name: Release (LamaVibe)

# Builds the LamaVibe installers for macOS and Windows from this repository's
# source and attaches them to a release here. Linux is packaged locally.
# The flavor is selected by ZCODE_LAMA_IDENTITY=1.

on:
  push:
    tags: ["lamavibe-v*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. lamavibe-v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-latest
            arch: arm64
          - target: win
            os: windows-latest
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        env:
          ZCODE_ENV: production
          ZCODE_LAMA_IDENTITY: "1"
          # Tag-Version (lamavibe-v1.0.0 → 1.0.0) in das Produkt backen; sonst
          # maßgeblich die registrierte Flavor-Version in flavors/versions.json.
          ZCODE_APP_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.msi
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
            packages/desktop/dist/latest.yml
