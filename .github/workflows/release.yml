name: Release

# Baut die DeepVibe-Installer für macOS und Windows und hängt sie als Release
# an dieses Repository. Linux bauen wir lokal; die Linux-Pakete können in
# dasselbe Release hochgeladen werden.
#
# Der Updater zeigt auf …/releases/latest/download, also muss das Release
# "latest" sein (kein Draft, kein Prerelease) und die latest-*.yml enthalten.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-latest
            arch: arm64
          - target: win
            os: windows-latest
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        env:
          ZCODE_ENV: production
          # Tag-Version (v1.0.2 → 1.0.2) in das Produkt backen; sonst maßgeblich
          # die registrierte Flavor-Version in flavors/versions.json.
          ZCODE_APP_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          # 未签名发布:macOS 在 afterPack 阶段做 ad-hoc 签名(arm64 需要)。
          # 真正的 Developer-ID 签名/公证以后再接:必须一次性提供全部变量,缺一即
          # 构建失败 —— ZCODE_ENABLE_MAC_SIGN=1、APPLE_SIGNING_IDENTITY、
          # CSC_LINK(base64 .p12)、CSC_KEY_PASSWORD、APPLE_ID、
          # APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID。
          # (不要以空值传入 CSC_*/APPLE_*,否则 electron-builder 会报 "not a file".)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.msi
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
            packages/desktop/dist/latest.yml
